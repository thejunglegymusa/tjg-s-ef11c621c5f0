<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>TJG Signage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:"Samsung Sharp Sans",system-ui,Arial,sans-serif;cursor:none}
#stage{position:absolute;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;opacity:0;transition:opacity .6s}
.layer.on{opacity:1}
.layer h1{font-size:var(--h,9vmin);margin:0 5%;line-height:1.05}.layer p{font-size:var(--p,4.5vmin);margin:2vmin 5%}
.layer img,.layer video,.layer iframe{width:100%;height:100%;object-fit:var(--fit,contain);border:0;background:#000}
#clock{position:absolute;right:2vmin;bottom:1.5vmin;color:#fff9;font-size:3vmin;z-index:5}
#dbg{position:absolute;left:1vmin;top:1vmin;background:#000c;color:#0f0;font:2vmin monospace;padding:1vmin;z-index:9;white-space:pre;display:none}
</style></head>
<body><div id="stage"><div class="layer" id="A"></div><div class="layer" id="B"></div><div id="clock"></div></div><div id="dbg"></div>
<script>
/* TJG clean-room signage player. No VXT code used.
 URL params: screen=<id> (picks playlist via playlist.json "screens"), src=<playlist url | published Google Sheet CSV url>,
 rotate=0|90|270 (portrait content on a TV mounted sideways w/o OSD rotation), debug=1 (status overlay). */
var Q=new URLSearchParams(location.search),SRC=Q.get('src')||'playlist.json',SCREEN=Q.get('screen')||'default',ROT=+(Q.get('rotate')||0),DEBUG=Q.get('debug')==='1';
var data=null,idx=0,timer=null,cur='A',lastOk=0,lastErr='',reloadToken=null,started=Date.now(),shown=0;
function $(i){return document.getElementById(i)}
function applyRotate(){var s=$('stage'),w=innerWidth,h=innerHeight;
 if(ROT===90){s.style.width=h+'px';s.style.height=w+'px';s.style.transform='translate('+w+'px,0) rotate(90deg)'}
 else if(ROT===270){s.style.width=h+'px';s.style.height=w+'px';s.style.transform='translate(0,'+h+'px) rotate(-90deg)'}
 else{s.style.width=w+'px';s.style.height=h+'px';s.style.transform='none'}}
addEventListener('resize',applyRotate);applyRotate();
function csvToJson(t){ // Google Sheet columns: screen,type,src,title,body,bg,duration,days,from,to,start,end,fit
 var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];
  if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f||row.length){row.push(f);rows.push(row)}
 var hd=rows.shift().map(function(h){return h.trim().toLowerCase()}),pl={},sc={default:'default'};
 rows.forEach(function(r){var o={};hd.forEach(function(h,j){if(r[j]!==undefined&&r[j].trim()!=='')o[h]=r[j].trim()});if(!o.type)return;
  var s=o.screen||'default';sc[s]=s;(pl[s]=pl[s]||[]).push({type:o.type,src:o.src,title:o.title,body:o.body,bg:o.bg,fit:o.fit,duration:+o.duration||10,
  schedule:(o.days||o.from||o.to||o.start||o.end)?{days:o.days,from:o.from,to:o.to,start:o.start,end:o.end}:null})});
 return {version:1,refreshMinutes:5,screens:sc,playlists:pl}}
function load(){var u=SRC+(SRC.indexOf('?')>-1?'&':'?')+'t='+Date.now();
 return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(function(t){
  var j=(t.trim()[0]=='{')?JSON.parse(t):csvToJson(t);
  if(reloadToken!==null&&j.reloadToken&&j.reloadToken!==reloadToken){location.reload();return}
  reloadToken=j.reloadToken||''; data=j;lastOk=Date.now();lastErr='';
  try{localStorage.setItem('tjg-pl',JSON.stringify(j))}catch(e){}
  if(navigator.serviceWorker&&navigator.serviceWorker.controller){var m=[];for(var k in j.playlists)j.playlists[k].forEach(function(x){if(x.src&&x.type!=='web')m.push(x.src)});navigator.serviceWorker.controller.postMessage({precache:m})}
 }).catch(function(e){lastErr=String(e);if(!data){try{data=JSON.parse(localStorage.getItem('tjg-pl')||'null')}catch(_){}}})}
function hm(s){var a=s.split(':');return (+a[0])*60+(+a[1]||0)}
function active(it,now){var sc=it.schedule;if(!sc)return true;now=now||new Date();var m=now.getHours()*60+now.getMinutes();
 if(sc.days&&String(sc.days).indexOf(String(now.getDay()))<0)return false;
 if(sc.from&&sc.to&&hm(sc.to)<hm(sc.from)){if(m<hm(sc.from)&&m>=hm(sc.to))return false} // overnight window
 else{if(sc.from&&m<hm(sc.from))return false;if(sc.to&&m>=hm(sc.to))return false}
 if(sc.start&&now<new Date(sc.start))return false;if(sc.end&&now>new Date(sc.end))return false;return true}
function pick(){if(!data)return[];var n=(data.screens&&(data.screens[SCREEN]||data.screens['default']))||SCREEN;var l=(data.playlists&&data.playlists[n])||[];return l.filter(function(x){return active(x)})}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function next(){clearTimeout(timer);var list=pick();var nx=cur==='A'?'B':'A',el=$(nx),old=$(cur);
 if(!list.length){el.innerHTML='<h1>The Jungle Gym</h1>';el.style.background='#1f7a3a';swap(el,old,nx);timer=setTimeout(next,30000);return}
 var it=list[idx++%list.length];el.style.background=it.bg||'#000';el.style.setProperty('--fit',it.fit||'contain');
 var dur=(+it.duration||10)*1000,done=false;function go(){if(!done){done=true;next()}}
 if(it.type==='image'){el.innerHTML='<img src="'+esc(it.src)+'">';el.firstChild.onerror=go}
 else if(it.type==='video'){el.innerHTML='<video src="'+esc(it.src)+'" autoplay muted playsinline preload="auto"></video>';var v=el.firstChild;v.onended=go;v.onerror=go;dur=it.duration?dur:600000}
 else if(it.type==='web'){el.innerHTML='<iframe src="'+esc(it.src)+'" sandbox="allow-scripts allow-same-origin"></iframe>'}
 else el.innerHTML='<h1>'+esc(it.title)+'</h1><p>'+esc(it.body)+'</p>';
 swap(el,old,nx);shown++;timer=setTimeout(go,dur)}
function swap(el,old,nx){el.classList.add('on');old.classList.remove('on');setTimeout(function(){if(!old.classList.contains('on')){var v=old.querySelector('video');if(v){v.pause();v.removeAttribute('src');v.load()}old.innerHTML=''}},800);cur=nx}
function beat(){var b={screen:SCREEN,ua:navigator.userAgent,up:Math.round((Date.now()-started)/1000),shown:shown,lastOk:lastOk,err:lastErr,ver:data&&data.version,ts:new Date().toISOString(),w:innerWidth,h:innerHeight};
 if(DEBUG)$('dbg').textContent=JSON.stringify(b,null,1);
 if(data&&data.heartbeatUrl){try{fetch(data.heartbeatUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(b)})}catch(e){}}}
setInterval(function(){$('clock').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})},1000);
if(DEBUG)$('dbg').style.display='block';
load().then(function(){next();beat();
 setInterval(load,((data&&data.refreshMinutes)||5)*60000);setInterval(beat,60000);
 setInterval(function(){if(navigator.onLine!==false)location.reload()},6*3600*1000);});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
// watchdog: if nothing advanced for 15 min, reload
var lastShown=0;setInterval(function(){if(shown===lastShown)location.reload();lastShown=shown},15*60000);
</script></body></html>
