<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta charset="utf-8"><title>TJG Signage</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,Helvetica,sans-serif;cursor:none}
#stage{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;-webkit-transform-origin:0 0;transform-origin:0 0}
.layer{position:absolute;top:0;right:0;bottom:0;left:0;display:-webkit-box;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;color:#fff;text-align:center;opacity:0;-webkit-transition:opacity .6s;transition:opacity .6s}
.layer.on{opacity:1}
.layer h1{font-size:9vmin;margin:0 5%;line-height:1.05}.layer p{font-size:4.5vmin;margin:2vmin 5%}
.layer img,.layer video,.layer iframe{width:100%;height:100%;border:0;background:#000;object-fit:contain}
#clock{position:absolute;right:2vmin;bottom:1.5vmin;color:rgba(255,255,255,.6);font-size:3vmin;z-index:5}
#dbg{position:absolute;left:1vmin;top:1vmin;background:rgba(0,0,0,.8);color:#0f0;font:2vmin monospace;padding:1vmin;z-index:9;white-space:pre;display:none}
</style></head>
<body><div id="stage"><div class="layer" id="A"></div><div class="layer" id="B"></div><div id="clock"></div></div><div id="dbg"></div>
<script>
/* TJG clean-room signage player (ES5, no VXT code). Params: screen, src (playlist JSON or published Google Sheet CSV), rotate=0|90|270, debug=1 */
function qp(k){var m=new RegExp('[?&]'+k+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):null}
var SRC=qp('src')||'playlist.json',SCREEN=qp('screen')||'default',ROT=+(qp('rotate')||0),DEBUG=qp('debug')==='1';
var data=null,idx=0,timer=null,cur='A',lastOk=0,lastErr='',reloadToken=null,started=Date.now(),ticks=0,shown=0,stallT=null;
function $(i){return document.getElementById(i)}
function xf(s,v){s.webkitTransform=v;s.transform=v}
function applyRotate(){var s=$('stage').style,w=innerWidth,h=innerHeight;
 if(ROT===90){s.width=h+'px';s.height=w+'px';xf(s,'translate('+w+'px,0) rotate(90deg)')}
 else if(ROT===270){s.width=h+'px';s.height=w+'px';xf(s,'translate(0,'+h+'px) rotate(-90deg)')}
 else{s.width=w+'px';s.height=h+'px';xf(s,'none')}}
window.addEventListener('resize',applyRotate);applyRotate();
function safeReload(){fetch('index.html?probe='+Date.now(),{cache:'no-store'}).then(function(r){if(r.ok)location.reload()})['catch'](function(){})}
function csvToJson(t){ // columns: screen,type,src,title,body,bg,duration,days,from,to,start,end,fit ; type=config rows: title=key, body=value
 var rows=[],row=[],f='',q=false,i,c;for(i=0;i<t.length;i++){c=t.charAt(i);
  if(q){if(c=='"'&&t.charAt(i+1)=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}
  else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t.charAt(i+1)=='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f||row.length){row.push(f);rows.push(row)}
 var hd=rows.shift().map(function(h){return h.replace(/^\s+|\s+$/g,'').toLowerCase()}),out={version:1,refreshMinutes:5,screens:{'default':'default'},playlists:{}};
 rows.forEach(function(r){var o={};hd.forEach(function(h,j){var v=r[j];if(v!==undefined&&v.replace(/\s/g,'')!=='')o[h]=v.replace(/^\s+|\s+$/g,'')});if(!o.type)return;
  if(o.type==='config'){out[o.title]=isNaN(+o.body)?o.body:+o.body;return}
  var s=o.screen||'default';out.screens[s]=s;(out.playlists[s]=out.playlists[s]||[]).push({type:o.type,src:o.src,title:o.title,body:o.body,bg:o.bg,fit:o.fit,
  duration:o.duration?+o.duration:(o.type==='video'?0:10),
  schedule:(o.days||o.from||o.to||o.start||o.end)?{days:o.days,from:o.from,to:o.to,start:o.start,end:o.end}:null})});
 return out}
function mediaList(j){var m=[],k;for(k in j.playlists)(j.playlists[k]||[]).forEach(function(x){if(x.src&&x.type!=='web')m.push(x.src)});return m}
function precache(j){if(!j||!navigator.serviceWorker)return;navigator.serviceWorker.ready.then(function(reg){var w=reg.active||navigator.serviceWorker.controller;if(w)w.postMessage({precache:mediaList(j)})})['catch'](function(){})}
function load(){var u=/^blob:/.test(SRC)?SRC:SRC+(SRC.indexOf('?')>-1?'&':'?')+'t='+Date.now();
 return fetch(u,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(function(t){
  var j=(t.replace(/^\s+/,'').charAt(0)=='{')?JSON.parse(t):csvToJson(t);
  if(reloadToken!==null&&j.reloadToken&&j.reloadToken!==reloadToken){safeReload()}
  reloadToken=j.reloadToken||'';data=j;lastOk=Date.now();lastErr='';
  try{localStorage.setItem('tjg-pl',JSON.stringify(j))}catch(e){}
  precache(j);
 })['catch'](function(e){lastErr=String(e);if(!data){try{data=JSON.parse(localStorage.getItem('tjg-pl')||'null')}catch(_){}}})}
function hm(s){var a=String(s).split(':');return (+a[0])*60+(+a[1]||0)}
function pd(s,endOfDay){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(s);if(m)return endOfDay?new Date(+m[1],+m[2]-1,+m[3],23,59,59,999):new Date(+m[1],+m[2]-1,+m[3]);return new Date(s)}
function active(it,now){var sc=it.schedule;if(!sc)return true;now=now||new Date();var m=now.getHours()*60+now.getMinutes();
 if(sc.days&&String(sc.days).indexOf(String(now.getDay()))<0)return false;
 if(sc.from&&sc.to&&hm(sc.to)<hm(sc.from)){if(m<hm(sc.from)&&m>=hm(sc.to))return false}
 else{if(sc.from&&m<hm(sc.from))return false;if(sc.to&&m>=hm(sc.to))return false}
 if(sc.start&&now<pd(sc.start,false))return false;if(sc.end&&now>pd(sc.end,true))return false;return true}
function pick(){if(!data)return[];var n=(data.screens&&(data.screens[SCREEN]||data.screens['default']))||SCREEN;var l=(data.playlists&&data.playlists[n])||[];return l.filter(function(x){return active(x)})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function killVideo(o){var v=o&&o.querySelector('video');if(v){v.onended=v.onerror=null;try{v.pause();v.removeAttribute('src');v.load()}catch(e){}}}
function next(){clearTimeout(timer);clearInterval(stallT);ticks++;var list=pick();var nx=cur==='A'?'B':'A',el=$(nx),old=$(cur);
 if(!list.length){killVideo(old);el.innerHTML='<h1>The Jungle Gym</h1>';el.style.background='#1f7a3a';swap(el,old,nx);timer=setTimeout(next,30000);return}
 var it=list[idx++%list.length];el.style.background=it.bg||'#000';
 var dur=(+it.duration||10)*1000,done=false;function go(){if(!done){done=true;next()}}
 if(it.type==='image'){el.innerHTML='<img src="'+esc(it.src)+'">';el.firstChild.style.objectFit=it.fit||'contain';el.firstChild.onerror=go}
 else if(it.type==='video'){killVideo(old);old.innerHTML=''; // one decoder at a time
  el.innerHTML='<video src="'+esc(it.src)+'" autoplay muted playsinline preload="auto"></video>';var v=el.firstChild,lt=-1;
  v.style.objectFit=it.fit||'contain';v.muted=true;v.onended=go;v.onerror=go;var p=v.play();if(p&&p['catch'])p['catch'](go);
  stallT=setInterval(function(){if(done||!v.parentNode){clearInterval(stallT);return}if(v.currentTime===lt)go();lt=v.currentTime},8000);
  dur=+it.duration?dur:600000}
 else if(it.type==='web'){el.innerHTML='<iframe src="'+esc(it.src)+'" sandbox="allow-scripts allow-same-origin"></iframe>'}
 else el.innerHTML='<h1>'+esc(it.title)+'</h1><p>'+esc(it.body)+'</p>';
 swap(el,old,nx);shown++;timer=setTimeout(go,dur)}
function swap(el,old,nx){el.className='layer on';old.className='layer';setTimeout(function(){if(old.className.indexOf('on')<0){killVideo(old);old.innerHTML=''}},800);cur=nx}
function beat(){var d=new Date(),b={screen:SCREEN,ua:navigator.userAgent,up:Math.round((Date.now()-started)/1000),shown:shown,ticks:ticks,items:pick().length,lastOk:lastOk,err:lastErr,ver:data&&data.version,reloadToken:reloadToken,
 ts:d.toISOString(),local:d.toString(),tzOffsetMin:d.getTimezoneOffset(),online:navigator.onLine,sw:!!(navigator.serviceWorker&&navigator.serviceWorker.controller),w:innerWidth,h:innerHeight};
 if(DEBUG)$('dbg').textContent=JSON.stringify(b,null,1);
 if(data&&data.heartbeatUrl&&window.fetch)fetch(data.heartbeatUrl,{method:'POST',mode:'no-cors',body:JSON.stringify(b)})['catch'](function(){})}
function pad(n){return (n<10?'0':'')+n}
setInterval(function(){var d=new Date(),h=d.getHours();$('clock').textContent=((h%12)||12)+':'+pad(d.getMinutes())+(h<12?' AM':' PM')},1000);
if(DEBUG)$('dbg').style.display='block';
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')['catch'](function(){});
load().then(function(){next();beat();
 setInterval(load,((data&&data.refreshMinutes)||5)*60000);setInterval(beat,60000);
 setInterval(safeReload,6*3600*1000);});
// watchdog: counts every rotation tick (incl. the off-hours fallback), so an empty schedule never loops reloads
var lastTicks=0;setInterval(function(){if(ticks===lastTicks)safeReload();lastTicks=ticks},15*60000);
</script></body></html>
