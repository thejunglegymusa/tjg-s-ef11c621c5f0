<style>

</style></head>
<body><div id="stage"><div class="layer on" id="A" style="background:#1f7a3a"><h1>The Jungle Gym</h1><p>Loading&hellip;</p></div><div class="layer" id="B"></div><div id="clock"></div></div><div id="dbg"></div>

<script>

var PLAYER=6;
function qp(k){var m=new RegExp('[?&]'+k+'=([^&#]*)').exec(location.search);return m?decodeURIComponent(m[1].replace(/\+/g,' ')):null}

 return{y:u.getUTCFullYear(),mo:u.getUTCMonth()+1,d:u.getUTCDate(),h:u.getUTCHours(),mi:u.getUTCMinutes(),dow:u.getUTCDay(),ymd:u.getUTCFullYear()+'-'+pad(u.getUTCMonth()+1)+'-'+pad(u.getUTCDate()),src:'manual'}}
function laIntl(d){var o={};FMT.formatToParts(d).forEach(function(x){o[x.type]=x.value});var h=+o.hour%24;if(o.dayPeriod)h=h%12+(/^p/i.test(o.dayPeriod)?12:0);
 var r={y:+o.year,mo:+o.month,d:+o.day,h:h,mi:+o.minute,dow:DOW[o.weekday],ymd:o.year+'-'+o.month+'-'+o.day,src:'intl'};
 if(isNaN(r.y+r.mo+r.d+r.h+r.mi)||r.dow===undefined||!/^\d{4}-\d\d-\d\d$/.test(r.ymd))throw Error('bad parts');return r}

function mv(u){var v=data&&data.mediaVersion;return v?u+(u.indexOf('?')>-1?'&':'?')+'mv='+encodeURIComponent(v):u}
var SRC0=qp('src'),SRC=(SRC0&&(/^blob:/.test(SRC0)||/^[A-Za-z0-9_\-]+\.json$/.test(SRC0)))?SRC0:'playlist.json',SCREEN=qp('screen')||'default',ROT=+(qp('rotate')||0),DEBUG=qp('debug')==='1';

function $(i){return document.getElementById(i)}
function xf(s,v){s.webkitTransform=v;s.transform=v}
function applyRotate(){var s=$('stage').style,w=innerWidth,h=innerHeight;
 if(ROT===90){s.width=h+'px';s.height=w+'px';xf(s,'translate('+w+'px,0) rotate(90deg)')}
 else if(ROT===270){s.width=h+'px';s.height=w+'px';xf(s,'translate(0,'+h+'px) rotate(-90deg)')}

function mediaList(j){var m=[],k,v=j.mediaVersion;for(k in j.playlists)(j.playlists[k]||[]).forEach(function(x){var u=(x.type==='image'||x.type==='video')&&safeMedia(x.src);if(u)m.push(v?u+'?mv='+encodeURIComponent(v):u)});return m}

var loading=false;

 return tfetch(u,{cache:'no-store'},8000).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(j){
  if(!j||typeof j!=='object'||!j.playlists)throw Error('bad playlist');
  if(reloadToken!==null&&j.reloadToken&&j.reloadToken!==reloadToken){safeReload()}
  reloadToken=j.reloadToken||'';data=j;lastOk=Date.now();lastErr='';
  try{localStorage.setItem('tjg-pl',JSON.stringify(j))}catch(e){}

function hm(s){var a=String(s).split(':');return (+a[0])*60+(+a[1]||0)}
function dOK(sc,dow){return !sc.days||String(sc.days).indexOf(String(dow))>-1}
function active(it,now){var sc=it.schedule;if(!sc)return true;var t=la(now),m=t.h*60+t.mi,f=sc.from?hm(sc.from):null,e=sc.to?hm(sc.to):null;

  if(m>=f){if(!dOK(sc,t.dow))return false}else if(m<e){if(!dOK(sc,(t.dow+6)%7))return false}else return false}
 else{if(!dOK(sc,t.dow))return false;if(f!==null&&m<f)return false;if(e!==null&&m>=e)return false}
 if(sc.start){if(/^\d{4}-\d\d-\d\d$/.test(sc.start)){if(t.ymd<sc.start)return false}else if((now||new Date())<new Date(sc.start))return false}

function pick(){if(!data)return[];var n=(data.screens&&(data.screens[SCREEN]||data.screens['default']))||SCREEN;var l=(data.playlists&&data.playlists[n])||[];return l.filter(function(x){return TYPES[x.type]&&active(x)})}
/* escape all playlist text; [[...]] marks a placeholder (rendered highlighted so staff see it needs a real value) */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}).replace(/\[\[(.*?)\]\]/g,'<span class="ph">$1</span>')}
function color(c,d){return /^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(String(c||''))?c:d}
var BRAND='<div class="brand">The Jungle Gym</div>';
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function clk(t){return ((t.h%12)||12)+':'+pad(t.mi)+(t.h<12?' AM':' PM')}
function arr(a,n){return (a&&a.length)?a.slice(0,n):[]}
var TYPES={
 slide:function(it){return BRAND+'<h1>'+esc(it.title)+'</h1><p>'+esc(it.subtitle||it.body)+'</p>'},
 title:function(it){return BRAND+'<div class="t-title">'+(it.kicker?'<div class="kick">'+esc(it.kicker)+'</div>':'')+'<h1>'+esc(it.title)+'</h1><p>'+esc(it.subtitle||it.body)+'</p></div>'},
 schedule:function(it){var r=arr(it.rows,8).map(function(x){return '<tr><td class="d">'+esc(x.day)+'</td><td class="tm">'+esc(x.time)+'</td><td><span class="dot" style="background:'+color(x.color,'#F26B21')+'"></span>'+esc(x.name)+(x.note?' <span class="nt">'+esc(x.note)+'</span>':'')+'</td></tr>'}).join('');
  return BRAND+'<h1>'+esc(it.title||'This week at the gym')+'</h1>'+(it.subtitle?'<p>'+esc(it.subtitle)+'</p>':'')+'<table class="sched">'+r+'</table>'},
 promo:function(it){var q=safeUrl(it.qr),svg=(q&&window.QR)?QR.svg(q,'#14432A','#fff'):'';
  return BRAND+'<div class="promo"><div class="tx">'+(it.kicker?'<div class="kick">'+esc(it.kicker)+'</div>':'')+'<h1>'+esc(it.headline||it.title)+'</h1>'+(it.price?'<div class="price">'+esc(it.price)+'</div>':'')+(it.priceNote?'<div class="pn">'+esc(it.priceNote)+'</div>':'')+(it.body?'<p style="margin:2vmin 0 0;text-align:left">'+esc(it.body)+'</p>':'')+(it.cta?'<div class="cta">'+esc(it.cta)+'</div>':'')+'</div>'+
  (svg?'<div><div class="qr">'+svg+'</div><div class="ql">'+esc(it.qrLabel||'Scan with your phone')+'</div></div>':'')+'</div>'},
 announcement:function(it){return BRAND+(it.kicker?'<div class="kick">'+esc(it.kicker)+'</div>':'')+'<h1>'+esc(it.title)+'</h1><p>'+esc(it.body)+'</p>'+(it.footer?'<div class="foot">'+esc(it.footer)+'</div>':'')},
 list:function(it){return BRAND+'<h1>'+esc(it.title)+'</h1><ul class="list">'+arr(it.items,8).map(function(x,i){return '<li><span class="n">'+(i+1)+'</span>'+esc(x)+'</li>'}).join('')+'</ul>'},
 image:function(it,ms){return '<img alt="" src="'+esc(mv(ms))+'">'+((it.caption||it.sub)?'<div class="cap"><h2>'+esc(it.caption)+'</h2>'+(it.sub?'<p>'+esc(it.sub)+'</p>':'')+'</div>':'')},
 video:function(it,ms){return '<video src="'+esc(mv(ms))+'" autoplay muted playsinline preload="auto"></video>'+(it.caption?'<div class="cap"><h2>'+esc(it.caption)+'</h2></div>':'')},
 clock:function(it){return BRAND+'<div class="t-clock"><div class="tm tclk"></div><div class="dt tdate"></div>'+(it.subtitle?'<p>'+esc(it.subtitle)+'</p>':'')+'</div>'}};
var DEFBG={slide:'#1f7a3a',title:'#1f7a3a',schedule:'#14432A',promo:'#1f7a3a',announcement:'#F7EFE1',list:'#14432A',image:'#000',video:'#000',clock:'#14432A'};

 for(i=0;i<e.length;i++)e[i].textContent=c;for(i=0;i<f.length;i++)f[i].textContent=WD[t.dow]+', '+MON[t.mo-1]+' '+t.d+', '+t.y;
 $('clock').style.display=document.querySelector('.layer.on .t-clock')?'none':''}
function next(){clearTimeout(timer);clearInterval(stallT);ticks++;var list=pick();var nx=cur==='A'?'B':'A',el=$(nx),old=$(cur);
 if(!list.length){killVideo(old);el.removeAttribute('data-type');el.innerHTML='<h1>The Jungle Gym</h1>';el.style.background='#1f7a3a';el.style.color='';swap(el,old,nx);timer=setTimeout(next,30000);return}

 var dur=(+it.duration||10)*1000,done=false;function go(){if(!done){done=true;next()}}function fail(){if(!done){clearTimeout(timer);clearInterval(stallT);timer=setTimeout(go,2000)}}

 if(it.type==='video'){killVideo(old);old.innerHTML=''}

 if(it.type==='image'){var im=el.querySelector('img');im.style.objectFit=it.fit||'cover';im.onerror=fail}
 else if(it.type==='video'){var v=el.querySelector('video'),lt=-1;v.style.objectFit=it.fit||'contain';v.muted=true;v.onended=go;v.onerror=fail;var p=v.play();if(p&&p['catch'])p['catch'](fail);

</script></body></html>
